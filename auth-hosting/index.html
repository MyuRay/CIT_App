<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>CIT App | メールアドレスの確認</title>
  <link rel="stylesheet" href="/registration.css">
</head>
<body><main>
  <p class="brand">CIT App</p>
  <h1>アプリで登録を続ける</h1>
  <p>このページを開いただけでは、メール認証やアカウント作成は完了しません。</p>
  <ol>
    <li>スマートフォンのメールアプリに戻ります。</li>
    <li>届いたメールの登録リンクを長押しし、リンクをコピーします。</li>
    <li>CIT Appの登録画面で「リンクからアプリが開かない場合」を開き、貼り付けて続けます。</li>
  </ol>
  <p class="note">送信先と同じ大学メールアドレスを入力してください。確認リンクはほかの人と共有しないでください。</p>
  <a href="https://cit-app.com/" rel="noreferrer">CIT Appの案内を見る</a>
</main></body>
</html>
